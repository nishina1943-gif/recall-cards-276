<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>C-GAB 学習ドリル</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf3ef;color:#173a32;font:16px/1.65 system-ui,sans-serif}main{max-width:620px;margin:auto;padding:28px 18px 60px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #a8bdb2;padding-bottom:12px}header b{letter-spacing:.12em}h1{font-size:clamp(25px,5vw,36px);margin:24px 0 12px}p{margin:12px 0}button,select{font:inherit;padding:12px 16px;border:1px solid #a6b8ac;border-radius:12px;background:white;color:inherit;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #d78400}.primary{background:#165443;border-color:#165443;color:white;font-weight:700}button:disabled{opacity:.5}label,select{display:block;width:100%}select{margin:6px 0 16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.actions button{flex:1;min-width:125px}article{background:#fff;border:1px solid #c1d3c6;border-radius:20px;padding:clamp(20px,5vw,36px);margin:16px 0;box-shadow:0 5px 18px #21433009;overflow-wrap:anywhere}h2{font-size:clamp(22px,4.7vw,29px);line-height:1.5;margin:14px 0}small{font-size:14px;color:#496357}progress{width:100%;accent-color:#176149}#answer{border-top:1px solid #c7d9cf;margin-top:24px;padding-top:16px}#value{font-size:24px;font-weight:bold}.back{background:transparent;border:0;text-decoration:underline}footer{font-size:14px;margin-top:24px;color:#4d655a}[hidden]{display:none!important}
#choices{display:grid;gap:8px}#choices button{text-align:left;line-height:1.5}#choices button:disabled{opacity:1}#choices .right{background:#daeee2;border-color:#367553}#choices .wrong{background:#f9e6df;border-color:#ad6050}#passage{padding:14px;background:#f0f5f2;border-radius:10px}#next{width:100%}</style><main><header><b>C-GAB</b><span>学習ドリル</span></header><p id="status" role="status">カードを読み込み中…</p>
<section id="home" hidden><h1>今日の10問</h1><label>モード<select id="mode"><option value="quiz">問題モード</option><option value="cards">暗記カード</option></select></label><p id="guide"></p><article><label>科目<select id="subject"><option>すべて</option><option>言語</option><option>非言語</option><option>英語</option></select></label><p id="stats"></p><div class="actions"><button class="primary" id="begin">練習を始める</button><button id="review">要復習だけ</button></div></article></section>
<section id="study" hidden><button class="back" id="exit">科目選択に戻る</button><h1 id="position"></h1><progress id="bar"></progress><article aria-live="polite"><small id="theme"></small><p id="passage" hidden></p><h2 id="question"></h2><div id="choices" hidden></div><div id="answer" hidden><small>解答</small><div id="value"></div></div></article><div class="actions"><button class="primary" id="flip">答えを見る</button></div><button id="next" class="primary" hidden>次の問題へ</button><div id="ratings" class="actions" hidden><button id="miss">もう一度</button><button class="primary" id="know">覚えた</button></div></section>
<section id="done" hidden><h1>練習完了</h1><article><p id="summary"></p><div class="actions"><button id="again">要復習だけ解く</button><button class="primary" id="menu">科目を選ぶ</button></div></article></section><footer>学習履歴はこのブラウザに保存されます。</footer></main><script type="module" src="app.js"></script></html>
